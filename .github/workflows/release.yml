name: Publish beta 0.1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify manifest version
        run: node -e "if(require('./manifest.json').version!=='0.1.2')process.exit(1)"
      - name: Create beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create 0.1.2 main.js manifest.json styles.css
          --target "$GITHUB_SHA"
          --title "0.1.2"
          --notes "Community-review corrections: safe view lifecycle, current API compatibility, awaited callbacks, safer frontmatter handling, and searchable settings."
          --prerelease
